project_short_name: MoWA
stage: hlc_gci
task_id: M4-001
experiment_id: E-004
config_role: hlcgci_long_training_candidate

launch_guard:
  launch_ready: true
  requires_human_confirmation: true
  human_confirmed: true
  policy_confirmed: true
  reason: formal long-training draft for E-004 HLC-GCI; execution entrypoint remains to be wired

run_id: MoWA-E-004_hlc_gci_4090_long_draft
run_root_dir: playground/mowa_ckpt
experiment_role: mowa_hlc_gci
seed: 42
wandb_entity: silencewx-harbin-institute-of-technology
wandb_project: MoWA
wandb_mode: online
is_debug: false
version_id: "0.21"

references:
  interface_config: configs/mowa/mowa_hlc_gci_interface.yaml
  checkpoint_preflight_report: docs_zh/mowa/mowa_e004_hlc_gci_checkpoint_preflight_smoke.json

interface:
  history_latent_dim: 1024
  condition_hidden_dim: 1024
  history_steps: 10
  compressed_history_dim: 512
  gate_hidden_dim: 256
  batch_size_smoke: 2
  condition_token_count: 4
  injection_policy: condition_path_only

history_contract:
  sampling_policy: train_inference_consistent_window_sampling
  history_source: robot_history_latent_only
  future_action_policy: target_only
  leakage_guard: future_action_not_input

training:
  per_device_batch_size: 2
  gradient_accumulation_steps: 16
  effective_batch_size: 32
  max_train_steps: 80000
  num_warmup_steps: 500
  save_interval: 2000
  eval_interval: 2000
  logging_frequency: 50
  checkpoint_format: lightweight
  checkpoint_max_shard_size: 4GB
  save_checkpoint_as_directory: true
  resume_policy: resume_latest_complete_only
  delete_or_overwrite_policy: no_delete_without_confirmation

notes:
  - This is a formal long-training draft for HLC-GCI wired to starVLA/training/train_starvla.py.
  - HLC-GCI and history-latent batch loading are present as conditioning in the training framework.
  - The cache root now points at the shared real Wan2.2 latent cache for OpenDrawer target/human and can be reused across E-003/E-004.
