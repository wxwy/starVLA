run_id: P0-M6-H2-total-baseline_starflow_libero-4in1_qwen3vl4b_mlp
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: starflow_vla
is_debug: false
version_id: "0.21"

framework:
  name: QwenOFT
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
  action_model:
    action_model_type: MLP
    action_dim: 7
    state_dim: 8
    action_hidden_dim: 2048
    action_horizon: 8
    future_action_window_size: 7
    past_action_window_size: 0

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen2.5vl
    per_device_batch_size: 1

  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_all
    action_type: delta_qpos
    sequential_step_sampling: false
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 8
    num_workers: 3
    prefetch_factor: 2
    load_all_data_for_training: true
    video_backend: torchvision_av

trainer:
  max_train_steps: 80000
  num_warmup_steps: 0
  save_interval: 250
  eval_interval: 500
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: qwen_vl_interface
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 20
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  checkpoint_format: lightweight
  enable_local_checkpoint_staging: true
  local_checkpoint_root: /localdisk-tmp
  local_checkpoint_keep_count: 1
  save_format: safetensors
  save_checkpoint_as_directory: true
  save_with_training_state: false
  checkpoint_max_shard_size: 4GB
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
