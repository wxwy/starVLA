project_short_name: MoWA
stage: hlc_gci
experiment_id: E-004
config_role: training_command_long_training_candidate_requires_confirmation

launch_guard:
  launch_ready: true
  training_started: false
  requires_human_confirmation: true
  human_confirmed: true
  policy_confirmed: true

command_candidate:
  entrypoint: starVLA/training/train_starvla.py
  launcher: python_single_process
  num_processes: 1
  mixed_precision: none
  config_yaml: configs/mowa/mowa_e004_hlc_gci_long_training_launch_candidate.yaml
  command: >-
    .venv/bin/python starVLA/training/train_starvla.py
    --config_yaml configs/mowa/mowa_e004_hlc_gci_long_training_launch_candidate.yaml

runtime_targets:
  gpu_type: A4090
  num_gpus: 1
  per_device_batch_size: 2
  gradient_accumulation_steps: 16
  effective_batch_size: 32
  max_train_steps: 80000
  save_interval: 2000
  expected_vram: long_training_4090_target
  runtime_evidence: docs_zh/mowa/mowa_e004_hlc_gci_long_training_launch_smoke.json

checkpoint_policy:
  run_root_dir: playground/mowa_ckpt
  checkpoint_format: lightweight
  save_interval: 2000
  save_checkpoint_as_directory: true
  resume_policy: resume_latest_complete_only
  delete_or_overwrite_policy: no_delete_without_confirmation

logging:
  wandb_mode: online
  logging_frequency: 50

notes:
  - This command candidate records the train_starvla entrypoint for E-004 long training.
  - The HLC-GCI module and history-latent batch contract are wired into train_starvla as conditioning.
  - Remaining gap: the long-training config still points to the smoke-scale latent cache root.
