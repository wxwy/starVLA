launch_guard:
  launch_ready: true
  training_started: false
  requires_human_confirmation: true
  policy_confirmed: true
  human_confirmed: true
  reason: formal long-training launch for E-003 future latent prior without history; confirmed for execution

run_id: MoWA-E-003_future_latent_prior_wo_history
run_root_dir: playground/mowa_ckpt/MoWA-E-003_future_latent_prior_wo_history
experiment_id: E-003
experiment_role: mowa_future_latent_prior_wo_history
seed: 42
wandb_entity: silencewx-harbin-institute-of-technology
wandb_project: MoWA
wandb_mode: online
is_debug: false
version_id: "0.21"

latent_cache:
  dataset_path: playground/Datasets/robocasa365/v1.0/target/atomic
  cache_root: playground/Datasets/robocasa365_wan2.2_latent/v1.0/target/atomic
  encoder_name: Wan-AI/Wan2.2-TI2V-5B-Diffusers
  encoder_version: wan2.2-vae-v1
  encoder_kind: wan2.2-vae
  encoder_model_path: playground/Pretrained_models/Wan-AI/Wan2.2-TI2V-5B-Diffusers
  instruction_text_latent: playground/Datasets/robocasa365_wan2.2_latent/v1.0/target/atomic/instruction_text_latents.pt
  latent_dim: 1024
  episode_indices: null  # use all episodes; set to a small list for smoke runs
  anchor_mode: production
  current_window_steps: 1
  future_window_steps: 8
  history_window_steps: 0
  allow_partial_windows: false
  overwrite: false
  materialize_cache_for_dry_run: true
  override_action_horizon_from_cache: true
  video_keys:
    - observation.images.robot0_agentview_left
    - observation.images.robot0_eye_in_hand

interface:
  current_latent_dim: 1024
  text_hidden_dim: 4096
  hidden_dim: 2048
  future_latent_dim: 48
  batch_size_smoke: 4
  input_policy: wanpi_backbone_pooled_hidden_plus_text
  target_policy: future_vae_latent_channel_vector

framework:
  name: WanPI
  starflow_ft_variant: ft0
  state_mode: continuous_head
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Wan-AI/Wan2.2-TI2V-5B-Diffusers
    attn_implementation: flash_attention_2
    vl_hidden_dim: 3072
    num_vl_layers: 30
  action_model:
    action_model_type: LayerwiseFM
    action_dim: 12
    state_dim: 32
    action_horizon: 32
    past_action_window_size: 0
    repeated_diffusion_steps: 1
    num_inference_timesteps: 4
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 0
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64
      cross_attention_dim: 1024
  world_model:
    base_wm: ./playground/Pretrained_models/Wan-AI/Wan2.2-TI2V-5B-Diffusers
    use_text_cache: true
    use_visual_cache: true
    gradient_checkpointing: true
    extract_layers:
      - -1
  mowa:
    enable_qwenpi_projector_dtype_alignment: true
    enable_layerwise_bridge_token_coupling: true
    enable_future_supervision_loss: true
    enable_future_latent_prior_loss: true
    layerwise_bridge_feature_source: mowa_future_feature_heads
    layerwise_bridge_active_heads:
      - task_progress
      - action_outcome_class
    future_supervision_active_heads:
      - task_progress
      - action_outcome_class
    wam_feature_dim: 1024
    action_hidden_dim: 1024
    num_bridge_tokens: 2
    multi_view:
      enabled: true
      views: [main, wrist]
      flatten_view_into_batch: true
      shared_wan_backbone: true
      view_embedding: true
      dynamic_wrist_pose_embedding: false
      debug_mode: normal
      inference_future_steps: 8
      inference_flow_steps: 4
    cross_view:
      enabled: true
      mode: per_timestep
      bidirectional: true
      num_layers: 10
      start_layer_ratio: 0.6667
      num_heads: 8
      bottleneck_dim: 512
      zero_init_output: true
      gate_init: 0.001
    future_loss:
      main_weight: 1.0
      wrist_weight: 1.0
      normalize_per_view: true
    noise:
      shared_timestep_across_views: true
      shared_noise_across_views: false
    action_fusion:
      mode: learnable_queries
      num_queries: 8
      num_heads: 8
    done_head:
      hidden_dim: 512
      loss_weight: 1.0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/robocasa365
    data_mix: robocasa365_open_drawer_target_human
    action_type: delta_ee
    sequential_step_sampling: false
    per_device_batch_size: 4
    num_workers: 8
    load_all_data_for_training: false
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchvision_av
    enable_mowa_future_labels: true

training:
  per_device_batch_size: 4
  gradient_accumulation_steps: 8
  effective_batch_size: 32
  max_train_steps: 80000
  num_warmup_steps: 500
  save_interval: 500
  eval_interval: 500
  checkpoint_format: lightweight
  resume_policy: resume_latest_complete_only

trainer:
  enable_mowa_future_supervision_loss: true
  enable_mowa_future_latent_prior_loss: true
  max_train_steps: 80000
  num_warmup_steps: 500
  save_interval: 500
  eval_interval: 500
  repeated_diffusion_steps: 1
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: backbone
  loss_scale:
    vla: 1.0
    vlm: 0.0
    mowa_future_supervision: 1.0
    mowa_future_latent_prior: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 20
  gradient_clipping: 1.0
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  checkpoint_format: lightweight
  resume_policy: resume_latest_complete_only
  is_resume: false
  enable_local_checkpoint_staging: false
  save_format: safetensors
  save_checkpoint_as_directory: true
  save_with_training_state: false
  save_frozen_backbone: false
  checkpoint_max_shard_size: 4GB
  checkpoint_permanent_steps: [5000, 10000, 20000, 30000, 40000, 50000, 60000, 70000, 80000]
  checkpoint_keep_latest_count: 3
  strip_optimizer_from_non_latest_checkpoints: true
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
