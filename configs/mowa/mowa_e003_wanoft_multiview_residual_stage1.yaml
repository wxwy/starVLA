launch_guard:
  launch_ready: true
  training_started: true
  requires_human_confirmation: true
  policy_confirmed: true
  human_confirmed: true
  reason: 原生 WanOFT 功能保持、零训练闭环、UMT5 持久化表和 Stage1 单步训练 smoke 已通过

run_id: MoWA-E-003-WanOFT-multiview-residual-stage1
run_root_dir: playground/mowa_ckpt
experiment_id: E-003-WanOFT-MV-Stage1
experiment_role: wanoft_multiview_residual_stage1
seed: 42
wandb_entity: silencewx-harbin-institute-of-technology
wandb_project: MoWA
wandb_mode: online
is_debug: false
version_id: "0.21"

# WanOFT 使用 Wan2.2 的 UMT5（4096 维）指令缓存，避免训练和服务常驻 10.6 GiB 文本编码器。
latent_cache:
  instruction_text_latent: playground/Datasets/libero_wan2.2_latent/instruction_text_latents.pt

framework:
  name: WanOFT
  qwenvl:
    base_vlm: playground/Pretrained_models/Wan-AI/Wan2.2-TI2V-5B-Diffusers
  world_model:
    base_wm: playground/Pretrained_models/Wan-AI/Wan2.2-TI2V-5B-Diffusers
    extract_layers: [-1]
    legacy_vae_input: true
    use_text_cache: true
  action_model:
    action_model_type: MLP
    action_dim: 7
    state_dim: 7
    action_horizon: 8
    future_action_window_size: 7
    past_action_window_size: 0
  multi_view_residual:
    enabled: true

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_all
    action_type: delta_qpos
    sequential_step_sampling: false
    per_device_batch_size: 2
    num_workers: 8
    prefetch_factor: 2
    load_all_data_for_training: false
    obs_image_size: null
    video_backend: torchvision_av

trainer:
  full_path_dry_run_report: docs_zh/mowa/wanoft_multiview_stage1_full_path_dry_run.json
  max_train_steps: 3000
  mixed_precision: bf16
  num_warmup_steps: 100
  save_interval: 500
  eval_interval: 250
  learning_rate:
    base: 1.0e-4
    multi_view_fusion: 1.0e-4
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-6
  freeze_modules: backbone,action_query_proj,action_model
  pretrained_checkpoint: /disk/rl/models/mowa_init_candidates/WM4A-Wan2d2-OFT-LIBERO-4in1/checkpoints/steps_60000_pytorch_model.pt
  reload_modules: backbone,action_query_proj,action_model
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 1.0e-8
  logging_frequency: 20
  gradient_clipping: 1.0
  gradient_accumulation_steps: 2
  checkpoint_format: lightweight
  is_resume: false
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
