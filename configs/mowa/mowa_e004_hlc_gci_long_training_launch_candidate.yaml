launch_guard:
  launch_ready: true
  training_started: false
  requires_human_confirmation: true
  policy_confirmed: true
  human_confirmed: true
  reason: formal long-training launch for E-004 HLC-GCI; confirmed for execution

run_id: MoWA-E-004_hlc_gci_4090_long
run_root_dir: playground/mowa_ckpt
experiment_id: E-004
experiment_role: mowa_hlc_gci
seed: 42
wandb_entity: silencewx-harbin-institute-of-technology
wandb_project: MoWA
wandb_mode: online
is_debug: false
version_id: "0.21"

latent_cache:
  dataset_path: playground/Datasets/robocasa365/v1.0/target/atomic/OpenDrawer/20250816/lerobot
  cache_root: playground/Datasets/robocasa365_wan2.2_latent/v1.0/target/atomic/OpenDrawer/20250816/lerobot
  encoder_name: Wan-AI/Wan2.2-TI2V-5B-Diffusers
  encoder_version: wan2.2-vae-v1
  encoder_kind: wan2.2-vae
  encoder_model_path: playground/Pretrained_models/Wan-AI/Wan2.2-TI2V-5B-Diffusers
  latent_dim: 1024
  episode_indices: null  # use all episodes; set to a small list for smoke runs
  anchor_mode: production
  current_window_steps: 1
  future_window_steps: 8
  history_window_steps: 8
  allow_partial_windows: false
  overwrite: true
  materialize_cache_for_dry_run: true
  video_keys:
    - observation.images.robot0_agentview_left

framework:
  name: StarFlowVLA
  starflow_ft_variant: ft0
  state_mode: discretized_instruction
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
    num_vl_layers: 36
  action_model:
    action_model_type: LayerwiseFM
    action_dim: 12
    state_dim: 16
    action_horizon: 8
    future_action_window_size: 7
    past_action_window_size: 0
    repeated_diffusion_steps: 1
    num_inference_timesteps: 4
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 0
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64
  mowa:
    enable_qwenpi_projector_dtype_alignment: true
    enable_layerwise_bridge_token_coupling: true
    enable_hlc_gci_conditioning: true
    enable_future_supervision_loss: true
    layerwise_bridge_feature_source: mowa_future_feature_heads
    layerwise_bridge_active_heads:
      - task_progress
      - action_outcome_class
    future_supervision_active_heads:
      - task_progress
      - action_outcome_class
    wam_feature_dim: 1024
    action_hidden_dim: 1024
    num_bridge_tokens: 2

interface:
  history_latent_dim: 1024
  condition_hidden_dim: 1024
  history_steps: 10
  compressed_history_dim: 512
  gate_hidden_dim: 256
  batch_size_smoke: 2
  condition_token_count: 4
  injection_policy: condition_path_only

history_contract:
  sampling_policy: train_inference_consistent_window_sampling
  history_source: robot_history_latent_only
  future_action_policy: target_only
  leakage_guard: future_action_not_input

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/robocasa365
    data_mix: robocasa365_open_drawer_target_human
    action_type: delta_ee
    sequential_step_sampling: false
    per_device_batch_size: 2
    num_workers: 3
    load_all_data_for_training: false
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchvision_av
    enable_mowa_future_labels: true

training:
  per_device_batch_size: 2
  gradient_accumulation_steps: 16
  effective_batch_size: 32
  max_train_steps: 80000
  num_warmup_steps: 500
  save_interval: 2000
  eval_interval: 2000
  checkpoint_format: lightweight
  resume_policy: resume_latest_complete_only

trainer:
  enable_mowa_future_supervision_loss: true
  max_train_steps: 80000
  num_warmup_steps: 500
  save_interval: 2000
  eval_interval: 2000
  repeated_diffusion_steps: 1
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: qwen_vl_interface
  loss_scale:
    vla: 1.0
    vlm: 0.0
    mowa_future_supervision: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 50
  gradient_clipping: 1.0
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  checkpoint_format: lightweight
  resume_policy: resume_latest_complete_only
  is_resume: false
  enable_local_checkpoint_staging: false
  save_format: safetensors
  save_checkpoint_as_directory: true
  save_with_training_state: false
  checkpoint_max_shard_size: 4GB
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
