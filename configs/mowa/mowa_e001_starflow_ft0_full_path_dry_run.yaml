run_id: MoWA-E-001_starflow_ft0_full_path_dry_run
run_root_dir: playground/mowa_ckpt
experiment_id: E-001
seed: 42
wandb_entity: your_wandb_entity
wandb_project: mowa
is_debug: false
version_id: "0.21"

framework:
  name: StarFlowVLA
  starflow_ft_variant: ft0
  state_mode: discretized_instruction
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
    num_vl_layers: 36
  action_model:
    action_model_type: LayerwiseFM
    action_dim: 12
    state_dim: 16
    action_horizon: 16
    future_action_window_size: 15
    past_action_window_size: 0
    repeated_diffusion_steps: 1
    num_inference_timesteps: 4
    add_pos_embed: true
    max_seq_len: 1024
    num_target_vision_tokens: 0
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    diffusion_model_cfg:
      action_dit_hidden_dim: 1024
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: ada_norm
      positional_embeddings: null
      attention_head_dim: 64
  mowa:
    enable_qwenpi_projector_dtype_alignment: true
    enable_layerwise_bridge_token_coupling: true
    wam_feature_dim: 1024
    action_hidden_dim: 1024
    num_bridge_tokens: 2

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: playground/Datasets/robocasa365
    data_mix: robocasa365_open_drawer_target_human
    action_type: delta_ee
    sequential_step_sampling: false
    per_device_batch_size: 1
    num_workers: 0
    load_all_data_for_training: false
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchvision_av
    enable_mowa_p0_labels: true

trainer:
  full_path_dry_run_only: true
  full_path_dry_run_fetch_batch: true
  full_path_dry_run_forward_batch: true
  full_path_dry_run_report: docs_zh/mowa/mowa_e001_starflow_ft0_full_path_dry_run.json
  max_train_steps: 1
  num_warmup_steps: 0
  save_interval: 1000
  eval_interval: 1000
  repeated_diffusion_steps: 1
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 1
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  checkpoint_format: lightweight
  is_resume: false
  enable_local_checkpoint_staging: false
  save_format: safetensors
  save_checkpoint_as_directory: true
  save_with_training_state: false
  checkpoint_max_shard_size: 4GB
  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
